<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб-тренажёр по UI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

    <style>
        /* Кнопка переключения темы — левый верхний угол */
        .theme-toggle-btn {
            position: fixed;
            top: 1.2rem;
            left: 1.2rem;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
        }

        .theme-toggle-btn:active {
            transform: translateY(0);
        }

        .theme-toggle-btn i {
            font-size: 1.1rem;
        }

        @media (max-width: 576px) {
            .theme-toggle-btn {
                top: 0.8rem;
                left: 0.8rem;
                padding: 0.45rem 0.9rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <button type="button" id="themeToggle" class="theme-toggle-btn" aria-label="Переключить тему">
        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        <span id="themeLabel">Тёмная тема</span>
    </button>

    <main>
        <div class="hero-card">
            <i class="bi bi-palette2 hero-icon"></i>
            <h1>Веб-тренажёр по UI</h1>
            <p>Формирование компетенций в области пользовательского интерфейса. Практика, интерактив и мгновенная обратная связь.</p>

            <a href="2.html" class="btn btn-start">
                <i class="bi bi-play-circle-fill"></i>Начать обучение
            </a>
        </div>
    </main>

    <footer>
        <a href="10.html">
            <i class="bi bi-info-circle"></i>О проекте
        </a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (function () {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            const label = document.getElementById('themeLabel');
            const icon = document.getElementById('themeIcon');

            function applyTheme(isDark) {
                if (isDark) {
                    body.classList.add('dark-theme');
                    label.textContent = 'Светлая тема';
                    icon.className = 'bi bi-sun-fill';
                } else {
                    body.classList.remove('dark-theme');
                    label.textContent = 'Тёмная тема';
                    icon.className = 'bi bi-moon-stars-fill';
                }
            }

            // Восстанавливаем выбор пользователя из localStorage
            const savedTheme = localStorage.getItem('ui-trainer-theme');
            applyTheme(savedTheme === 'dark');

            // Переключение по клику
            btn.addEventListener('click', () => {
                const isDark = !body.classList.contains('dark-theme');
                applyTheme(isDark);
                localStorage.setItem('ui-trainer-theme', isDark ? 'dark' : 'light');
            });
        })();
    </script>
</body>
</html>
